name: APK handoff (temporary)

# Scratch job: republishes the APK from the build run onto a throwaway branch so
# it can be pulled over git. Actions artifacts are served from Azure blob
# storage, which the assistant's build session cannot reach. Both this file and
# the branch it pushes are deleted once the APK has been handed over — nothing
# here belongs in the repo long-term.

on:
  push:
    branches: [claude/android-apk-release-wntcda]
    paths: ['.github/workflows/apk-handoff.yml']

permissions:
  contents: write
  actions: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: huevista-android-apk
          run-id: 30811965551
          github-token: ${{ github.token }}
          path: apk

      - name: Push the APK to a throwaway branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh apk
          cd apk
          git init -q -b tmp/apk-handoff
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -qm 'APK handoff (delete this branch once collected)'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git push -f origin HEAD:refs/heads/tmp/apk-handoff
